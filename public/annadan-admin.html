<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Annadan Admin - Purvanchal Ganeshotsav 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --primary-red: #c1121f;
            --primary-gold: #ffb703;
            --dark-blue: #003049;
            --border-color: #cbd5e1;
            --card-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #fdfbf7;
            color: #2b2d42;
            padding: 16px 10px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header-card {
            background: linear-gradient(135deg, #780000, #c1121f);
            color: white;
            text-align: center;
            padding: 22px 16px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: var(--card-shadow);
        }

            .header-card h1 {
                font-size: 1.35rem;
                font-weight: 700;
            }

            .header-card p {
                font-size: 0.82rem;
                opacity: 0.9;
                margin-top: 4px;
            }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            border: 1px solid #f1f5f9;
            margin-bottom: 20px;
        }

            .card h3 {
                color: var(--dark-blue);
                margin-bottom: 14px;
                font-size: 1.1rem;
            }

        /* Add Item Form Grid */
        .add-form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 2fr auto;
            gap: 10px;
            align-items: end;
        }

        @media(max-width: 768px) {
            .add-form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

            .form-group label {
                font-size: 0.78rem;
                font-weight: 600;
                margin-bottom: 4px;
                color: var(--dark-blue);
            }

        input, select, textarea {
            width: 100%;
            padding: 9px 12px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            background: #fff;
        }

            input:focus, select:focus, textarea:focus {
                border-color: var(--primary-red);
            }

        .btn-add {
            background: linear-gradient(135deg, #c1121f, #780000);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(193, 18, 31, 0.25);
            height: 40px;
            white-space: nowrap;
        }

            .btn-add:hover {
                opacity: 0.9;
            }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #e2e8f0;
            padding: 10px;
            text-align: left;
            font-size: 0.83rem;
            vertical-align: middle;
        }

        th {
            background-color: #f8fafc;
            color: var(--dark-blue);
            font-weight: 600;
        }

        input.qty-input {
            width: 65px;
            padding: 6px;
            border: 1.5px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
            text-align: center;
        }

        /* Expanded Textarea for Notes */
        textarea.note-textarea {
            width: 100%;
            min-height: 80px;
            padding: 10px;
            border: 1.5px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            background: #fff;
            resize: vertical;
        }

        .btn-save {
            background: #059669;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

            .btn-save:hover {
                background: #047857;
            }

        .status-msg {
            font-size: 0.8rem;
            margin-top: 10px;
            text-align: center;
            font-weight: 600;
        }

        /* Mobile Responsive Card Layout for Inventory Items */
        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr {
                display: block;
            }

                thead tr {
                    display: none;
                }

                tr.admin-item-row {
                    background: #f8fafc;
                    border: 1px solid #cbd5e1;
                    border-radius: 12px;
                    margin-bottom: 16px;
                    padding: 14px;
                    box-shadow: 0 2px 5px rgba(0,0,0,0.03);
                }

                    tr.admin-item-row td {
                        border: none;
                        padding: 6px 0;
                        display: flex;
                        flex-direction: column;
                        align-items: flex-start;
                    }

                        tr.admin-item-row td::before {
                            content: attr(data-label);
                            font-size: 0.72rem;
                            font-weight: 700;
                            color: var(--dark-blue);
                            text-transform: uppercase;
                            margin-bottom: 2px;
                            letter-spacing: 0.5px;
                        }

                        tr.admin-item-row td.action-cell {
                            flex-direction: row;
                            justify-content: flex-end;
                            margin-top: 8px;
                            border-top: 1px solid #e2e8f0;
                            padding-top: 10px;
                        }

            input.qty-input {
                width: 100%;
                text-align: left;
            }

            textarea.note-textarea {
                width: 100%;
                min-height: 90px;
                font-size: 0.9rem;
                padding: 10px;
                background: #fff;
            }

            .btn-save {
                width: 100%;
                padding: 10px;
                font-size: 0.9rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-card">
            <h1>⚙️ Annadan Inventory Management</h1>
            <p>Add new food items, update quantities, and manage item notes</p>
        </div>

        <!-- Add New Item Card -->
        <div class="card">
            <h3>➕ Add New Annadan Item</h3>
            <form id="addItemForm" onsubmit="addNewItem(event)">
                <div class="add-form-grid">
                    <div class="form-group">
                        <label>Item Name *</label>
                        <input type="text" id="newItemName" placeholder="e.g. Mineral Water Bottles" required />
                    </div>
                    <div class="form-group">
                        <label>Total Needed *</label>
                        <input type="number" id="newTotalNeeded" min="1" placeholder="e.g. 100" required />
                    </div>
                    <div class="form-group">
                        <label>Unit *</label>
                        <select id="newUnit" required>
                            <option value="Kg">Kg</option>
                            <option value="Liters">Liters</option>
                            <option value="Packets">Packets</option>
                            <option value="Pieces">Pieces</option>
                            <option value="Sets">Sets</option>
                            <option value="Boxes">Boxes</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Special Notes (Optional)</label>
                        <input type="text" id="newNotes" placeholder="e.g. 1-litre bottles preferred" />
                    </div>
                    <button type="submit" class="btn-add">Add Item</button>
                </div>
            </form>
            <div id="addStatusMsg" class="status-msg"></div>
        </div>

        <!-- Inventory Table Card -->
        <div class="card">
            <h3>📋 Active Food Items & Instructions</h3>
            <div>
                <table>
                    <thead>
                        <tr>
                            <th style="width: 26%;">Item Name</th>
                            <th style="width: 10%;">Needed</th>
                            <th style="width: 10%;">Pledged</th>
                            <th style="width: 10%;">Rem.</th>
                            <th style="width: 32%;">Special Notes / Instructions</th>
                            <th style="width: 12%;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <tr><td colspan="6" style="text-align: center; color: #94a3b8;">Loading inventory...</td></tr>
                    </tbody>
                </table>
            </div>
            <div id="statusMsg" class="status-msg"></div>
        </div>
    </div>

    <script>
        async function loadAdminAnnadan() {
            try {
                const res = await fetch('/api/annadan/admin/items');
                const data = await res.json();
                if (data.status === 'success') {
                    let html = '';
                    data.items.forEach(item => {
                        html += `
                            <tr class="admin-item-row">
                                <td data-label="Item Name"><strong>${item.item_name}</strong> <small style="color:#64748b;">(${item.unit})</small></td>
                                <td data-label="Total Needed"><input type="number" id="needed_${item.id}" class="qty-input" value="${item.total_needed}" /></td>
                                <td data-label="Total Pledged"><input type="number" id="pledged_${item.id}" class="qty-input" value="${item.total_pledged}" /></td>
                                <td data-label="Remaining"><strong>${item.remaining_qty}</strong></td>
                                <td data-label="Special Notes / Instructions"><textarea id="note_${item.id}" class="note-textarea" placeholder="e.g. Brand instructions, donor names...">${item.notes || ''}</textarea></td>
                                <td class="action-cell" data-label=""><button class="btn-save" onclick="updateItem(${item.id})">Save Changes</button></td>
                            </tr>
                        `;
                    });
                    document.getElementById('adminTableBody').innerHTML = html;
                }
            } catch (err) {
                document.getElementById('adminTableBody').innerHTML = `<tr><td colspan="6" style="text-align:center; color:#c1121f;">Failed to load items.</td></tr>`;
            }
        }

        async function addNewItem(e) {
            e.preventDefault();
            const itemName = document.getElementById('newItemName').value.trim();
            const totalNeeded = document.getElementById('newTotalNeeded').value.trim();
            const unit = document.getElementById('newUnit').value;
            const notes = document.getElementById('newNotes').value.trim();
            const msgBox = document.getElementById('addStatusMsg');

            try {
                const res = await fetch('/api/annadan/admin/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ itemName, totalNeeded, unit, notes })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    msgBox.style.color = '#059669';
                    msgBox.innerText = '🎉 New item added successfully!';
                    document.getElementById('addItemForm').reset();
                    loadAdminAnnadan();
                    setTimeout(() => { msgBox.innerText = ''; }, 3500);
                } else {
                    throw new Error(data.message);
                }
            } catch (err) {
                msgBox.style.color = '#c1121f';
                msgBox.innerText = `Error: ${err.message}`;
            }
        }

        async function updateItem(id) {
            const totalNeeded = parseInt(document.getElementById(`needed_${id}`).value, 10);
            const totalPledged = parseInt(document.getElementById(`pledged_${id}`).value, 10);
            const notes = document.getElementById(`note_${id}`).value.trim();
            const msgBox = document.getElementById('statusMsg');

            try {
                const res = await fetch('/api/annadan/admin/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ itemId: id, totalNeeded, totalPledged, notes })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    msgBox.style.color = '#059669';
                    msgBox.innerText = '✓ Item updated successfully!';
                    loadAdminAnnadan();
                    setTimeout(() => { msgBox.innerText = ''; }, 3000);
                } else {
                    throw new Error(data.message);
                }
            } catch (err) {
                msgBox.style.color = '#c1121f';
                msgBox.innerText = `Error: ${err.message}`;
            }
        }

        window.onload = loadAdminAnnadan;
    </script>
</body>
</html>
